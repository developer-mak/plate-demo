<!DOCTYPE html>
<html>
<head>
    <title>PlateVision AI</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

    <style>
        html{
            background: #0c1116;
        }
        :root {
            --bg: #111820;
            --panel: rgba(31, 43, 53, .78);
            --panel2: rgba(20, 29, 36, .9);
            --cyan: #00ded0;
            --text: #eef7f8;
            --muted: #9caeb8;
        }
        .text-info {
            color: var(--cyan) !important;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(0,222,208,.18), transparent 30%),
                linear-gradient(180deg, #151d24, #0c1116);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        .app-shell {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 24px 18px 110px;
        }

        .app-title {
            font-family: Georgia, serif;
            font-size: 40px;
            letter-spacing: .5px;
            margin: 0;
        }

        .ready-pill {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.08);
            color: #c9d4d8;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            /* width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #00ded0;
            display: inline-block;
            box-shadow: 0 0 12px var(--cyan); */
            color:var(--cyan);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        .glass-card {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.08),
                0 18px 40px rgba(0,0,0,.32);
            backdrop-filter: blur(14px);
        }

        .preview-card {
            padding: 12px;
            margin-top: 24px;
        }

        .preview-wrap {
            position: relative;
            width: 100%;
            min-height: 260px;
            background: #0b1116;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.12);
        }

        canvas {
            width: 100%;
            max-width: 100%;
            display: block;
            border-radius: 20px;
        }

        .result-card {
            margin-top: 14px;
            padding: 14px;
        }

        #croppedPlate {
            width: 170px;
            max-width: 42%;
            border-radius: 12px;
            background: #06090c;
            border: 1px solid rgba(255,255,255,.16);
        }

        .plate-number {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: .5px;
            color: white;
            text-shadow: 0 0 12px rgba(0,222,208,.35);
            word-break: break-word;
        }

        .muted-label {
            color: var(--muted);
            font-size: 13px;
        }

        .history-card {
            margin-top: 16px;
            padding: 12px;
        }

        .records-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .record-item {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: 70px 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .record-item img {
            width: 70px;
            height: 48px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.15);
        }

        .record-plate {
            color: white;
            font-weight: 800;
            font-size: 16px;
        }

        .record-date {
            color: var(--muted);
            font-size: 12px;
        }

        .btn-neon {
            background: var(--cyan);
            color: #062426;
            border: 0;
            font-weight: 800;
            box-shadow: 0 0 24px rgba(0,222,208,.45);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 86px;
            background: linear-gradient(180deg, transparent, rgba(9,13,17,.96) 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
        }

        #captureBtn {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 7px solid rgba(255,255,255,.12);
            background: var(--cyan);
            color: #073134;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 31px;
            box-shadow: 0 0 26px rgba(0,222,208,.6);
            cursor: pointer;
            margin-bottom: 20px;
        }

        .scan-label {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 100;
            color: white;
            font-size: 14px;
        }

       

        .footer-actions {
            display: flex;
            gap: 8px;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 0;
            }

            .app-shell {
                border-radius: 34px;
            }
        }

        .record-delete {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 0, 0, .08);
        }
        
        .record-delete:hover {
            background: rgba(255, 0, 0, .18);
        }

        
    </style>
</head>

<body>
<div class="app-shell">

    <input type="file" id="imageInput" accept="image/*" hidden>

    <header class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-black border border-secondary rounded-3 d-flex align-items-center justify-content-center" style="width:44px;height:44px">
                <i class="bi bi-upc-scan text-info fs-5"></i>
            </div>
            <div>
                <h5 class="mb-0 fw-semibold">PlateVision AI</h5>
                <small class="text-secondary">License plate detection v1.2</small>
            </div>
        </div>

        <span id="loading_container" class="ready-pill">
            <span class="bi bi-cloud-download pulse"></span>
            <span id="loading"></span>
        </span>
        <!-- <span id="isReady" class="ready-pill d-none">
            <span class="pulse"></span>
            Ready
        </span> -->
    </header>

    <!-- <div id="loading" class="alert d-none">
        <div class="d-flex align-items-center gap-2">
            <div class="spinner-border spinner-border-sm text-info"></div>
            <span>Processing image...</span>
        </div>
    </div> -->

    <section class="glass-card preview-card">
        <div class="preview-wrap" id="previewWrap">
            <canvas id="canvas"></canvas>
        </div>

        <div class="glass-card result-card">
            <div class="d-flex align-items-center gap-3">
                <img id="croppedPlate" alt="Cropped Plate">

                <div class="flex-grow-1">
                    <div class="muted-label text-uppercase">License Plate</div>
                    <div class="plate-number font-monospace" id="plateText">Waiting...</div>
                    <div class="muted-label" id="response_time">Upload or Capture Vehicle Image</div>
                </div>
            </div>
        </div>
    </section>

    <section class="glass-card history-card">
        <div class="records-header">
            <div>
                <div class="fw-bold">Saved Records</div>
                <small class="text-secondary">Temporary local history</small>
            </div>

            <div class="footer-actions">
                <button class="btn btn-sm btn-outline-light" id="exportPdfBtn">
                    <i class="bi bi-file-earmark-arrow-down"></i> PDF
                </button>

                <button class="btn btn-sm btn-outline-danger" id="clearBtn">
                    <i class="bi bi-trash"></i> Clear
                </button>
            </div>
        </div>

        <div id="recordsList"></div>
    </section>

</div>

<div class="bottom-nav">
    <button id="captureBtn" type="button">
        <i class="bi bi-camera-fill"></i>
    </button>
</div>

<script src="app.js?v=1.2"></script>

</body>
</html>
