<!DOCTYPE html>
<html>
<head>
    <title>Plate Demo</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        body { background: #0d1117; }
        .scan-bar { position: absolute; left: 0; right: 0; height: 2px; background: #0dcaf0; opacity: .7; animation: scanMove 2.5s ease-in-out infinite; display: none; }
        @keyframes scanMove { 0%{top:0} 80%{top:calc(100% - 2px)} 100%{top:0} }
        .pulse { width: 8px; height: 8px; border-radius: 50%; background: #198754; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .capture-zone { border: 2px dashed #495057 !important; cursor: pointer; transition: border-color .2s, background .2s; }
        .capture-zone:hover { border-color: #0dcaf0 !important; background: rgba(13,202,240,.05) !important; }
        .scan-frame { border: 1.5px solid rgba(13,202,240,.4); position: absolute; inset: 10px; border-radius: 4px; pointer-events: none; }
    </style>
</head>
<body class="bg-dark text-white">
<div class="container py-4">

    <!-- Header -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="bg-black border border-secondary rounded-3 d-flex align-items-center justify-content-center" style="width:44px;height:44px">
            <i class="bi bi-upc-scan text-info fs-5"></i>
        </div>
        <div>
            <h5 class="mb-0 fw-semibold">PlateVision AI</h5>
            <small class="text-secondary">License plate detection &amp; OCR</small>
        </div>
        <span id="isReady" class="d-none badge bg-success bg-opacity-10 text-success border border-success ms-auto d-flex align-items-center gap-2 px-3 py-2">
            <span class="pulse"></span> Model ready
        </span>
    </div>
    <div id="loading" class="alert alert-info d-flex align-items-center gap-2 py-2 mt-3 d-none">
        <div class="spinner-border spinner-border-sm text-info" role="status"></div>
        Processing image...
    </div>
    <!-- Capture Button -->
    <div class="card bg-black border-secondary mb-3">
        <div class="card-body text-center py-4">
            <input type="file" id="imageInput" accept="image/*" hidden>
            <div class="capture-zone rounded-3 bg-black py-4 mb-0" id="captureBtn">
                <i class="bi bi-camera-fill text-info fs-3 d-block mb-1"></i>
                <span class="text-secondary small">Capture / Upload Image</span>
            </div>
            
        </div>
    </div>

    <!-- Main Grid -->
    <div class="row g-3 mb-3">
        <!-- Canvas -->
        <div class="col-md-8">
            <div class="card bg-black border-secondary h-100">
                <div class="card-header border-secondary d-flex align-items-center gap-2 text-secondary small text-uppercase" style="letter-spacing:.06em">
                    <i class="bi bi-image"></i> Captured Image
                </div>
                <div class="card-body p-3">
                    <div class="position-relative bg-dark rounded" style="aspect-ratio:16/9">
                        <div class="scan-frame"></div>
                        <canvas id="canvas" class="w-100 rounded"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="col-md-4 d-flex flex-column gap-3">
            <!-- Cropped Plate -->
            <div class="card bg-black border-secondary">
                <div class="card-header border-secondary d-flex align-items-center gap-2 text-secondary small text-uppercase" style="letter-spacing:.06em">
                    <i class="bi bi-viewfinder"></i> Cropped Plate
                </div>
                <div class="card-body text-center p-3">
                    <img id="croppedPlate" class="img-fluid rounded border border-secondary">
                </div>
            </div>

            <!-- OCR Result -->
            <div class="card bg-black border-secondary flex-grow-1">
                <div class="card-header border-secondary d-flex align-items-center gap-2 text-secondary small text-uppercase" style="letter-spacing:.06em">
                    <i class="bi bi-fonts"></i> OCR Result
                </div>
                <div class="card-body p-3">
                    <div class="text-secondary small mb-1" style="letter-spacing:.06em">PLATE NUMBER</div>
                    <h4 class="text-success fw-semibold font-monospace" id="plateText">Waiting...</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Records -->
    <div class="card bg-black border-secondary">
        <div class="card-header border-secondary d-flex align-items-center justify-content-between">
            <span class="d-flex align-items-center gap-2 text-secondary small text-uppercase" style="letter-spacing:.06em">
                <i class="bi bi-database"></i> Saved Records
            </span>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" id="exportPdfBtn">
                    <i class="bi bi-file-earmark-arrow-down"></i> Export PDF
                </button>
                <button class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1" id="clearBtn">
                    <i class="bi bi-trash"></i> Clear
                </button>
            </div>
        </div>
        <div class="card-body p-0" id="recordsList"></div>
    </div>

</div>
<script src="app.js"></script>
</body>
</html>
