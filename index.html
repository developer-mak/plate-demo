<!DOCTYPE html>
<html>
<head>
    <title>Plate Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-4">

    <div class="card shadow-sm mb-3">
        <div class="card-body text-center">
            <h3>License Plate Demo</h3>
            <p class="text-muted mb-3">Capture or upload image, detect plate, save records.</p>

            <input type="file" id="imageInput" accept="image/*" hidden>

            <button class="btn btn-primary w-100 mb-2" id="captureBtn">
                Capture / Upload Image
            </button>

            <div id="loading" class="alert alert-info d-none mt-3">
                Processing image...
            </div>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">Captured Image</div>
                <div class="card-body">
                    <canvas id="canvas" class="w-100 border rounded"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header">Cropped Plate</div>
                <div class="card-body text-center">
                    <img id="croppedPlate" class="img-fluid border rounded">
                    <h4 class="mt-3 text-success" id="plateText">Waiting...</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Saved Records</strong>
            <div>
                <button class="btn btn-sm btn-success" id="exportPdfBtn">Export PDF</button>
                <button class="btn btn-sm btn-danger" id="clearBtn">Clear</button>
            </div>
        </div>
        <div class="card-body">
            <div id="recordsList"></div>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
